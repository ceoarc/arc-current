<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 z" fill="#555"/>
    </marker>
    <marker id="arwT" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 z" fill="#2A7F7F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="660" rx="8" fill="#ffffff"/>

  <!-- ===== Panel A ===== -->
  <text x="40" y="42" font-size="19" font-weight="600" fill="#222">HVIL loop layout</text>
  <text x="40" y="64" font-size="13" fill="#666">A low-voltage monitoring loop running alongside the high-voltage wiring</text>

  <!-- HV bus -->
  <line x1="220" y1="130" x2="250" y2="130" stroke="#E08A2E" stroke-width="7"/>
  <line x1="340" y1="130" x2="520" y2="130" stroke="#E08A2E" stroke-width="7"/>
  <line x1="562" y1="130" x2="700" y2="130" stroke="#E08A2E" stroke-width="7"/>
  <text x="600" y="118" font-size="12" fill="#B06A16">High-voltage wiring</text>

  <!-- battery pack -->
  <rect x="50" y="85" width="170" height="90" rx="5" fill="#F7F7F5" stroke="#444" stroke-width="1.6"/>
  <text x="135" y="112" font-size="14" font-weight="600" fill="#222" text-anchor="middle">Battery pack</text>
  <rect x="72" y="126" width="30" height="30" rx="3" fill="#E4E4E0" stroke="#888"/>
  <rect x="110" y="126" width="30" height="30" rx="3" fill="#E4E4E0" stroke="#888"/>
  <rect x="148" y="126" width="30" height="30" rx="3" fill="#E4E4E0" stroke="#888"/>
  <text x="135" y="192" font-size="11" fill="#777" text-anchor="middle">Modules</text>

  <!-- main contactor -->
  <rect x="250" y="100" width="90" height="60" rx="5" fill="#fff" stroke="#444" stroke-width="1.6"/>
  <text x="295" y="126" font-size="12.5" fill="#222" text-anchor="middle">Main</text>
  <text x="295" y="143" font-size="12.5" fill="#222" text-anchor="middle">contactor</text>

  <!-- HV connector -->
  <rect x="520" y="112" width="20" height="36" rx="2" fill="#E08A2E" stroke="#B06A16"/>
  <rect x="542" y="112" width="20" height="36" rx="2" fill="#E08A2E" stroke="#B06A16"/>
  <text x="541" y="166" font-size="11.5" fill="#B06A16" text-anchor="middle">HV connector</text>

  <!-- inverter -->
  <rect x="700" y="100" width="150" height="60" rx="5" fill="#F7F7F5" stroke="#444" stroke-width="1.6"/>
  <text x="775" y="136" font-size="14" font-weight="600" fill="#222" text-anchor="middle">Inverter · Motor</text>

  <!-- BMS -->
  <rect x="50" y="265" width="150" height="60" rx="5" fill="#EAF3F3" stroke="#2A7F7F" stroke-width="1.6"/>
  <text x="125" y="291" font-size="13.5" font-weight="600" fill="#1E5F5F" text-anchor="middle">BMS · Controller</text>
  <text x="125" y="310" font-size="11" fill="#4A8686" text-anchor="middle">Monitors loop state</text>

  <!-- HVIL loop path -->
  <polyline points="200,282 250,282 250,212 305,212" fill="none" stroke="#2A7F7F" stroke-width="2.6"/>
  <polyline points="335,212 445,212" fill="none" stroke="#2A7F7F" stroke-width="2.6"/>
  <polyline points="475,212 585,212" fill="none" stroke="#2A7F7F" stroke-width="2.6"/>
  <polyline points="615,212 745,212 745,308 200,308" fill="none" stroke="#2A7F7F" stroke-width="2.6" marker-end="url(#arwT)"/>

  <!-- interlock switch symbols (closed) -->
  <line x1="305" y1="212" x2="333" y2="200" stroke="#2A7F7F" stroke-width="2.6"/>
  <circle cx="305" cy="212" r="3" fill="#2A7F7F"/><circle cx="335" cy="212" r="3" fill="#2A7F7F"/>
  <line x1="445" y1="212" x2="473" y2="200" stroke="#2A7F7F" stroke-width="2.6"/>
  <circle cx="445" cy="212" r="3" fill="#2A7F7F"/><circle cx="475" cy="212" r="3" fill="#2A7F7F"/>
  <line x1="585" y1="212" x2="613" y2="200" stroke="#2A7F7F" stroke-width="2.6"/>
  <circle cx="585" cy="212" r="3" fill="#2A7F7F"/><circle cx="615" cy="212" r="3" fill="#2A7F7F"/>

  <text x="320" y="242" font-size="11.5" fill="#333" text-anchor="middle">Pack cover</text>
  <text x="460" y="242" font-size="11.5" fill="#333" text-anchor="middle">Service disconnect</text>
  <text x="600" y="242" font-size="11.5" fill="#333" text-anchor="middle">Connector interlock pin</text>
  <text x="745" y="196" font-size="11.5" fill="#2A7F7F" text-anchor="middle">Low-voltage</text>
  <text x="745" y="211" font-size="11.5" fill="#2A7F7F" text-anchor="middle">monitoring loop</text>

  <!-- association hints -->
  <line x1="135" y1="176" x2="320" y2="196" stroke="#BBB" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="541" y1="150" x2="600" y2="196" stroke="#BBB" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- feedback arrow BMS -> contactor -->
  <polyline points="125,265 125,200 295,200 295,164" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="133" y="193" font-size="11.5" fill="#555">Loop broken → open contactor</text>

  <!-- divider -->
  <line x1="40" y1="368" x2="860" y2="368" stroke="#E2E2DE" stroke-width="1"/>

  <!-- ===== Panel B ===== -->
  <text x="40" y="404" font-size="19" font-weight="600" fill="#222">Pin engagement depth and separation order</text>
  <text x="40" y="426" font-size="13" fill="#666">The interlock pin sits shallower than the power pin, so it breaks first</text>

  <!-- left plug body -->
  <rect x="140" y="452" width="100" height="120" rx="5" fill="#F7F7F5" stroke="#444" stroke-width="1.6"/>
  <text x="190" y="590" font-size="11.5" fill="#555" text-anchor="middle">Plug</text>

  <!-- right receptacle -->
  <rect x="470" y="452" width="110" height="120" rx="5" fill="#F7F7F5" stroke="#444" stroke-width="1.6"/>
  <text x="525" y="590" font-size="11.5" fill="#555" text-anchor="middle">Receptacle</text>

  <!-- mating face -->
  <line x1="470" y1="440" x2="470" y2="584" stroke="#999" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="470" y="436" font-size="11" fill="#777" text-anchor="middle">Mating face</text>

  <!-- power pin -->
  <rect x="240" y="478" width="320" height="12" rx="2" fill="#E08A2E"/>
  <text x="246" y="470" font-size="12" fill="#B06A16">Power pin — deeper engagement</text>

  <!-- interlock pin -->
  <rect x="240" y="530" width="275" height="10" rx="2" fill="#2A7F7F"/>
  <text x="246" y="523" font-size="12" fill="#1E5F5F">Interlock pin — shallower engagement</text>

  <!-- depth difference -->
  <line x1="515" y1="556" x2="560" y2="556" stroke="#666" stroke-width="1"/>
  <line x1="515" y1="551" x2="515" y2="561" stroke="#666" stroke-width="1"/>
  <line x1="560" y1="551" x2="560" y2="561" stroke="#666" stroke-width="1"/>
  <text x="568" y="560" font-size="11" fill="#666">Depth difference</text>

  <!-- separation arrow -->
  <line x1="130" y1="612" x2="60" y2="612" stroke="#555" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="140" y="616" font-size="11.5" fill="#555">Separation</text>

  <text x="270" y="640" font-size="12.5" fill="#333">Pull begins → interlock pin clears → loop breaks → HV shut off → power pin separates</text>
</svg>
